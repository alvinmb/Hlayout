<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380" font-family="sans-serif">
  <style>
    .pad { fill: white; stroke: #333; stroke-width: 1.5; }
    .body { fill: none; stroke: #111; stroke-width: 3; }
    .pin-label { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .row-label { font-size: 12px; fill: #666; text-anchor: middle; }
  </style>

  <!-- body -->
  <rect class="body" x="110" y="110" width="200" height="160" />
  <text x="210" y="195" text-anchor="middle" font-size="16">SOT-8</text>
  <text x="210" y="215" text-anchor="middle" font-size="12" fill="#666">(proposed: rows on top/bottom walls)</text>

  <!-- bottom row: pins 1,2,3,4 left-to-right -->
  <g>
    <rect class="pad" x="130" y="270" width="24" height="50" />
    <text class="pin-label" x="142" y="295">1</text>
    <rect class="pad" x="176" y="270" width="24" height="50" />
    <text class="pin-label" x="188" y="295">2</text>
    <rect class="pad" x="222" y="270" width="24" height="50" />
    <text class="pin-label" x="234" y="295">3</text>
    <rect class="pad" x="268" y="270" width="24" height="50" />
    <text class="pin-label" x="280" y="295">4</text>
  </g>
  <text class="row-label" x="210" y="340">row 1: pins 1-4, left to right along BOTTOM wall</text>

  <!-- top row: pins 8,7,6,5 left-to-right (i.e. 5 at right, 8 at left) -->
  <g>
    <rect class="pad" x="130" y="60" width="24" height="50" />
    <text class="pin-label" x="142" y="85">8</text>
    <rect class="pad" x="176" y="60" width="24" height="50" />
    <text class="pin-label" x="188" y="85">7</text>
    <rect class="pad" x="222" y="60" width="24" height="50" />
    <text class="pin-label" x="234" y="85">6</text>
    <rect class="pad" x="268" y="60" width="24" height="50" />
    <text class="pin-label" x="280" y="85">5</text>
  </g>
  <text class="row-label" x="210" y="45">row 2: pins 5-8, right to left along TOP wall (continuing the wrap)</text>

  <!-- pin 1 marker note -->
  <circle cx="118" cy="278" r="4" fill="#c00" />
  <text x="60" y="300" font-size="12" fill="#c00">pin 1</text>
  <line x1="70" y1="296" x2="115" y2="282" stroke="#c00" stroke-width="1" />
</svg>
